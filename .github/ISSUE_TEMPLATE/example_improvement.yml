name: Example improvement
description: A change to a brief, paste, or model that would help every visitor
labels: [enhancement]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: From RELEASE-INFO.txt
    validations: {required: true}
  - type: input
    id: example
    attributes:
      label: Example
      description: Hatherley Plate, Moorfield Range, or shared operator docs
    validations: {required: true}
  - type: textarea
    id: outcome_blocked
    attributes:
      label: What a visitor cannot do today
      description: One or two sentences. No live client nouns.
    validations: {required: true}
  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed change
      description: Brief, paste fence, how-to, or model hygiene.
    validations: {required: true}
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: I confirm this report contains no tokens, keys, or credentials.
          required: true
