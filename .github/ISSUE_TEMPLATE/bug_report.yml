name: Bug report
description: Report a defect in a worked example, prompt, or model file
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: From RELEASE-INFO.txt
    validations: {required: true}
  - type: input
    id: surface
    attributes:
      label: Example / file
      description: Hatherley, Moorfield, prompt path, or model file
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: What happened, and how to reproduce it
      description: Inputs, expected vs actual result, Archi version
    validations: {required: true}
  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: I confirm this report contains no tokens, keys, or credentials.
          required: true
