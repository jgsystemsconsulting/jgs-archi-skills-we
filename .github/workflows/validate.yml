name: validate

# Self-contained content-integrity gate. Inline bash + python3 stdlib only.
# MUST NOT execute checked-out repository code (reads files only).
# Runs on pull_request (not pull_request_target).

on:
  push:
  pull_request:

permissions: read-all

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          python3 - <<'PY'
          import pathlib, sys
          required = [
              "LICENSE", "COPYRIGHT", "NOTICE", "README.md", "CHANGELOG.md",
              "RELEASE-INFO.txt", "CITATION.cff", "SECURITY.md",
              "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", ".gitignore",
              "docs/plant-brief.md", "docs/moorfield-brief.md", "docs/how-to-run.md",
              "models/hatherley-plate.archimate", "models/hatherley-plate.seed.archimate",
              "models/moorfield-range.archimate", "models/moorfield-range.seed.archimate",
              "prompts/README.md", "prompts/moorfield/README.md",
          ]
          missing = [f for f in required if not pathlib.Path(f).is_file()]
          if missing:
              print("::error::required files missing: " + ", ".join(missing))
              sys.exit(1)
          print("OK: required files present.")
          PY

      - name: Forbidden paths
        run: |
          python3 - <<'PY'
          import subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          parts = ("__pycache__", ".venv", ".worktrees", ".pytest_cache",
                   ".ruff_cache", ".bak")
          bad = [f for f in tracked if any(p in f for p in parts)]
          if bad:
              print("::error::forbidden tracked paths: " + ", ".join(bad[:20]))
              sys.exit(1)
          print("OK: no forbidden tracked paths.")
          PY

      - name: Forbidden content
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          rx_key = re.compile(r"BEGIN [A-Z ]*PRIVATE KEY")
          rx_conf = re.compile(r"CONFIDENTIAL\s+[-—]\s+Not for external distribution")
          hits = []
          for f in tracked:
              if f.startswith(".github/"):
                  continue
              if not f.endswith((".py", ".md", ".txt", ".yml", ".yaml",
                                 ".json", ".cff", ".html")):
                  continue
              text = pathlib.Path(f).read_text(encoding="utf-8", errors="ignore")
              if rx_key.search(text) or rx_conf.search(text):
                  hits.append(f)
          if hits:
              print("::error::leak sentinel in: " + ", ".join(hits[:20]))
              sys.exit(1)
          print("OK: no leak sentinels.")
          PY

      - name: Headers present
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          sentinel = "Copyright (c) 2026 JG Systems Consulting Ltd"
          missing = []
          for f in tracked:
              if not f.endswith(".py"):
                  continue
              head = pathlib.Path(f).read_text(encoding="utf-8", errors="ignore")[:600]
              if sentinel not in head or "SPDX-License-Identifier" not in head:
                  missing.append(f)
          if missing:
              print("::error::header/SPDX missing: " + ", ".join(missing[:20]))
              sys.exit(1)
          print("OK: python headers present.")
          PY

      - name: BOM check
        run: |
          python3 - <<'PY'
          import pathlib, sys
          hits = []
          for pat in ("*.toml", "*.json", "*.yaml", "*.yml", "*.cff"):
              for p in pathlib.Path(".").rglob(pat):
                  if ".git" in p.parts or not p.is_file():
                      continue
                  if p.read_bytes()[:3] == b"\xef\xbb\xbf":
                      hits.append(p.as_posix())
          if hits:
              print("::error::UTF-8 BOM in: " + ", ".join(hits))
              sys.exit(1)
          print("OK: no BOM in parser-critical files.")
          PY

      - name: Version consistency
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          def changelog_top():
              t = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
              m = re.search(r"^##\s*\[?v?(\d+\.\d+\.\d+)", t, re.M)
              return m.group(1) if m else None
          def release_info():
              t = pathlib.Path("RELEASE-INFO.txt").read_text(encoding="utf-8")
              m = re.search(r"^Version:\s*(\d+\.\d+\.\d+)", t, re.M)
              return m.group(1) if m else None
          def citation():
              t = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
              m = re.search(r"^version:\s*[\"']?(\d+\.\d+\.\d+)", t, re.M)
              return m.group(1) if m else None
          vals = {
              "CHANGELOG": changelog_top(),
              "RELEASE-INFO": release_info(),
              "CITATION.cff": citation(),
          }
          print(vals)
          uniq = {v for v in vals.values() if v}
          if None in vals.values() or len(uniq) != 1:
              print("::error::version mismatch across sources")
              sys.exit(1)
          print("OK: all versions agree at " + uniq.pop() + ".")
          PY
