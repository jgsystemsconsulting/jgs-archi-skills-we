name: validate

# Self-contained content-integrity gate. Inline bash + python3 stdlib only.
# MUST NOT execute checked-out repository code (reads files only).
# Runs on pull_request (not pull_request_target).

on:
  push:
  pull_request:

permissions: read-all

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          python3 - <<'PY'
          import pathlib, sys
          # Mirror: scripts/check_release.py REQUIRED. Edit both.
          required = [
              "LICENSE", "COPYRIGHT", "NOTICE", "README.md", "CHANGELOG.md",
              "RELEASE-INFO.txt", "CITATION.cff", "SECURITY.md",
              "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", ".gitignore",
              "docs/plant-brief.md", "docs/moorfield-brief.md", "docs/how-to-run.md",
              "models/hatherley-plate.archimate", "models/hatherley-plate.seed.archimate",
              "models/moorfield-range.archimate", "models/moorfield-range.seed.archimate",
              "prompts/README.md", "prompts/moorfield/README.md",
              "docs/index.html", "docs/site.css",
              "docs/runs/job-01-motivation-overview.png",
              "docs/runs/job-02-capability-map.png",
              "docs/runs/job-03-production-operations.png",
              "docs/runs/job-04-application-support.png",
              "docs/runs/job-05-technology-and-physical.png",
              "prompts/01-motivation.md", "prompts/02-capability.md",
              "prompts/03-operations.md", "prompts/04-application.md",
              "prompts/05-technology-closeout.md",
              "prompts/moorfield/01-motivation.md", "prompts/moorfield/02-capability.md",
              "prompts/moorfield/03-operations.md", "prompts/moorfield/04-application.md",
              "prompts/moorfield/05-technology-closeout.md",
          ]
          missing = [f for f in required if not pathlib.Path(f).is_file()]
          if missing:
              print("::error::required files missing: " + ", ".join(missing))
              sys.exit(1)
          print("OK: required files present.")
          PY

      - name: Forbidden paths
        run: |
          python3 - <<'PY'
          import subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          parts = ("__pycache__", ".venv", ".worktrees", ".pytest_cache",
                   ".ruff_cache", ".bak")
          bad = [f for f in tracked if any(p in f for p in parts)]
          if bad:
              print("::error::forbidden tracked paths: " + ", ".join(bad[:20]))
              sys.exit(1)
          print("OK: no forbidden tracked paths.")
          PY

      - name: Forbidden content
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          rx_key = re.compile(r"BEGIN [A-Z ]*PRIVATE KEY")
          rx_conf = re.compile(r"CONFIDENTIAL\s+[-—]\s+Not for external distribution")
          hits = []
          for f in tracked:
              if f.startswith(".github/"):
                  continue
              # Mirror: scripts/check_release.py FORBIDDEN_CONTENT suffix tuple. Edit both.
              if not f.endswith((".py", ".md", ".txt", ".yml", ".yaml",
                                 ".json", ".cff", ".html", ".archimate")):
                  continue
              if not pathlib.Path(f).is_file():
                  continue
              text = pathlib.Path(f).read_text(encoding="utf-8", errors="ignore")
              if rx_key.search(text) or rx_conf.search(text):
                  hits.append(f)
          if hits:
              print("::error::leak sentinel in: " + ", ".join(hits[:20]))
              sys.exit(1)
          print("OK: no leak sentinels.")
          PY

      - name: Headers present
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          sentinel = "Copyright (c) 2026 JG Systems Consulting Ltd"
          missing = []
          for f in tracked:
              if not f.endswith(".py"):
                  continue
              if not pathlib.Path(f).is_file():
                  continue
              head = pathlib.Path(f).read_text(encoding="utf-8", errors="ignore")[:600]
              if sentinel not in head or "SPDX-License-Identifier" not in head:
                  missing.append(f)
          if missing:
              print("::error::header/SPDX missing: " + ", ".join(missing[:20]))
              sys.exit(1)
          print("OK: python headers present.")
          PY

      - name: BOM check
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          # Mirror: scripts/check_release.py BOM_SUFFIXES. Edit both.
          suffixes = (".toml", ".json", ".yaml", ".yml", ".cff")
          hits = [
              f for f in tracked
              if f.endswith(suffixes)
              and pathlib.Path(f).is_file()
              and pathlib.Path(f).read_bytes()[:3] == b"\xef\xbb\xbf"
          ]
          if hits:
              print("::error::UTF-8 BOM in: " + ", ".join(hits))
              sys.exit(1)
          print("OK: no BOM in parser-critical files.")
          PY

      - name: Version consistency
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          # Mirror: scripts/check_release.py VERSION_SOURCES. Edit both.
          def changelog_top():
              t = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
              m = re.search(r"^##\s*\[?v?(\d+\.\d+\.\d+)", t, re.M)
              return m.group(1) if m else None
          def release_info():
              t = pathlib.Path("RELEASE-INFO.txt").read_text(encoding="utf-8")
              m = re.search(r"^Version:\s*(\d+\.\d+\.\d+)", t, re.M)
              return m.group(1) if m else None
          def citation():
              # Mirror: scripts/check_release.py C6 missing-source soft-fail. Edit both.
              p = pathlib.Path("CITATION.cff")
              if not p.is_file():
                  return None
              t = p.read_text(encoding="utf-8")
              m = re.search(r"^version:\s*[\"']?(\d+\.\d+\.\d+)", t, re.M)
              return m.group(1) if m else None
          vals = {
              "CHANGELOG": changelog_top(),
              "RELEASE-INFO": release_info(),
              "CITATION.cff": citation(),
          }
          print(vals)
          uniq = {v for v in vals.values() if v}
          if None in vals.values() or len(uniq) != 1:
              print("::error::version mismatch across sources")
              sys.exit(1)
          print("OK: all versions agree at " + uniq.pop() + ".")
          PY

      - name: Site version check
        run: |
          python3 - <<'PY'
          # Mirror: scripts/check_release.py check_site_version() (out of P1 scope; keep passing). Edit both.
          import pathlib, re, sys
          ri = pathlib.Path("RELEASE-INFO.txt").read_text(encoding="utf-8")
          m = re.search(r"^Version:\s*(\d+\.\d+\.\d+)", ri, re.M)
          expected = m.group(1) if m else None
          t = pathlib.Path("docs/index.html").read_text(encoding="utf-8")
          pats = [r'"softwareVersion":\s*"(\d+\.\d+\.\d+)"',
                  r"REV <b>(\d+\.\d+\.\d+)</b>",
                  r'<span class="label">Rev</span><b>(\d+\.\d+\.\d+)</b>']
          found = [re.search(p, t) for p in pats]
          vals = [mm.group(1) if mm else None for mm in found]
          print({"RELEASE-INFO": expected, "index.html softwareVersion": vals[0],
                 "index.html masthead REV": vals[1], "index.html footer Rev": vals[2]})
          if expected is None or any(v != expected for v in vals):
              print("::error::site page version mismatch")
              sys.exit(1)
          print("OK: site page versions agree at " + expected + ".")
          PY

      - name: ArchiMate product content
        run: |
          python3 - <<'PY'
          import pathlib, sys
          import xml.etree.ElementTree as ET
          # Mirror: scripts/check_release.py ArchiMate product content block. Edit both.
          XSI = "{http://www.w3.org/2001/XMLSchema-instance}type"
          ROOT_TAG = "{http://www.archimatetool.com/archimate}model"
          VIEW_SUFFIXES = ("DiagramModel", "SketchModel", "CanvasModel")
          SEED_RATIO = 10
          EXPECTED_VIEWS = {
              "models/moorfield-range.archimate": {
                  "id-02bfe33f26d844a1a34a314a40a400c0": ("archimate:ArchimateDiagramModel", "Motivation Overview", "motivation"),
                  "id-6967b8a5125d46e1b6ba0edbf9b9539b": ("archimate:ArchimateDiagramModel", "Capability Map", "capability_map"),
                  "id-782395c6d18347a9a24da626f81ee275": ("archimate:ArchimateDiagramModel", "Range Operations", "business_process_cooperation"),
                  "id-5ed7d076bfc449d78537f5468ed476fb": ("archimate:ArchimateDiagramModel", "Application Support", "application_cooperation"),
                  "id-7585e12756874cd1855d73253da55504": ("archimate:ArchimateDiagramModel", "Technology and Physical", "technology_usage"),
              },
              "models/hatherley-plate.archimate": {
                  "id-05f18c92556242fc8ce2a2252fc36867": ("archimate:ArchimateDiagramModel", "Motivation Overview", "motivation"),
                  "id-6613e98758a3455d95e1fcc5b8e731f7": ("archimate:ArchimateDiagramModel", "Capability Map", "capability_map"),
                  "id-c189cce2288642d8b1cf3c267270d571": ("archimate:ArchimateDiagramModel", "Production Operations", "business_process"),
                  "id-90bb9ec6131b44f9966ac494bd89a90c": ("archimate:ArchimateDiagramModel", "Application Support", "application_usage"),
                  "id-6ef45eb1bf8340f2b2eba45c4f92b9e9": ("archimate:ArchimateDiagramModel", "Technology and Physical", "technology_usage"),
              },
          }
          FREEZE = {
              "models/moorfield-range.archimate": ("RangePlan", "AirStack", "GroundOS", "LinkGate", "SortieBoard"),
              "models/hatherley-plate.archimate": ("OrderSight", "MillOS", "WorksERP", "PromiseSheet", "PlantGate"),
          }
          SEEDS = {
              "models/moorfield-range.seed.archimate": "models/moorfield-range.archimate",
              "models/hatherley-plate.seed.archimate": "models/hatherley-plate.archimate",
          }
          fails = []
          def parse_model(f):
              p = pathlib.Path(f)
              if not p.is_file():
                  return None
              try:
                  root = ET.parse(p).getroot()
              except ET.ParseError as exc:
                  fails.append(f"model parse error in {f}: {exc}")
                  return None
              if root.tag != ROOT_TAG:
                  fails.append(f"wrong root tag in {f}: {root.tag}")
              return root
          for f, expected in EXPECTED_VIEWS.items():
              root = parse_model(f)
              if root is None:
                  continue
              els = list(root.iter("element"))
              view_els = [e for e in els if e.get(XSI, "").endswith(VIEW_SUFFIXES)]
              if len(view_els) != len(expected):
                  fails.append(f"{f}: expected {len(expected)} views, found {len(view_els)}")
              found = {e.get("id"): (e.get(XSI), e.get("name"), e.get("viewpoint")) for e in view_els}
              for vid, want in expected.items():
                  got = found.get(vid)
                  if got != want:
                      fails.append(f"{f}: view {vid} expected {want}, found {got or 'missing'}")
              for vid, got in found.items():
                  if vid not in expected:
                      fails.append(f"{f}: unexpected view {vid} {got}")
              if any(e.get(XSI) == "archimate:WorkPackage" for e in els):
                  fails.append(f"{f}: archimate:WorkPackage present")
              apps = {e.get("name") for e in els if e.get(XSI) == "archimate:ApplicationComponent"}
              for name in FREEZE[f]:
                  if name not in apps:
                      fails.append(f"{f}: freeze application missing: {name}")
          for seed, model in SEEDS.items():
              root = parse_model(seed)
              if root is not None:
                  n = sum(1 for _ in root.iter("element"))
                  if n:
                      fails.append(f"seed not empty: {seed} has {n} element nodes")
              sp, mp = pathlib.Path(seed), pathlib.Path(model)
              if sp.is_file() and mp.is_file() and sp.stat().st_size * SEED_RATIO >= mp.stat().st_size:
                  fails.append(
                      f"seed too large: {seed} is {sp.stat().st_size} bytes, "
                      f"{SEED_RATIO}x must stay below {model} ({mp.stat().st_size} bytes)"
                  )
          if fails:
              for line in fails:
                  print("::error::" + line)
              sys.exit(1)
          print("OK: ArchiMate product content matches expectations.")
          PY
